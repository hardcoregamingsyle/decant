[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "nexus-dsl"
version = "0.1.0"
description = "Nexus — A minimal DSL for AI model training & hosting with VRAM optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Nexus Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "lark>=1.2.0",
    "unsloth>=2025.0",
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "datasets>=3.0.0",
    "trl>=0.12.0",
    "peft>=0.14.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.3.0",
    "sentencepiece>=0.2.0",
]

[project.urls]
Homepage = "https://github.com/nexus-dsl/nexus"
Documentation = "https://nexus-dsl.dev"

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.setuptools.package-data]
nexus = ["grammar.lark"]
